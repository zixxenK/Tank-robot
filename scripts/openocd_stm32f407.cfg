# OpenOCD configuration for the Hiwonder ROS Robot Controller V1.2,
# STM32F407VET6, using an ST-Link over SWD.
#
# This configuration is for flashing STM32F407VGTx using ST-Link
# via SWD (Serial Wire Debug) interface.
#
# Usage:
#   openocd -f scripts/openocd_stm32f407.cfg -c "program firmware/stm32_chassis/build/Release/RosRobotControllerM4.bin 0x8000000 verify reset exit"

# Interface configuration (ST-Link)
source [find interface/stlink.cfg]

# Transport is selected by the caller because OpenOCD 0.11 on the Rock64
# exposes `hla_swd`, while newer desktop builds commonly expose `swd`.
# Do not hard-code either transport in this shared target configuration.

# Target configuration (STM32F4 series)
source [find target/stm32f4x.cfg]

# Set target frequency to 1MHz for better stability
adapter speed 1000

# The board photos show an onboard RST button but no labeled NRST header.
# Keep OpenOCD independent of an unverified NRST wire; use the physical RST
# button after programming when a hardware reset is required.
reset_config none
