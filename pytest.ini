[pytest]
# The repository's offline contract suite is the portable smoke/E2E layer.
# Native ROS package tests remain owned by `colcon test` in an Ubuntu/ROS 2
# environment.
testpaths = tests
norecursedirs = .git .pytest_cache build install log host_ws/build host_ws/install host_ws/log
pythonpath = stubs
    host_ws/src/agent_core
    host_ws/src/robot_drivers
    host_ws/src/robot_teleop
    host_ws/src/robot_audio
    host_ws/src/navigation
    host_ws/src/perception
    host_ws/src/telemetry_logger
    host_ws/src/terrain_adaptation
