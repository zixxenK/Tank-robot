/**:
  ros__parameters:
    # The PS5 control map and track geometry are owned by
    # robot_control/config/control_map.yaml and are passed explicitly by the
    # bringup launch. This file contains hardware-bridge parameters only.
    encoder_ticks_per_rev: 1980  # JGB3865-520R45: 11 pulses * 4 edges * 45:1 gearbox

    # Production link: physical UART1 USB-C -> USART1 PA9/PA10, 1M 8N1.
    serial_port: /dev/rock64_stm32
    baud_rate: 1000000
    max_speed: 255
    motor_output_limit: 1.0   # Full signed command range; STM32 PID/protection remains authoritative
    stall_current_limit_a: 1.5 # Motor rating reference; current protection is enforced on the controller
    command_rate_hz: 50.0
    cmd_timeout: 0.25
    enable_motor_test_services: true
    motor_test_speed: 0.10
    motor_test_max_duration: 2.0
    servo_command_topic: /stm32/servo/command_degrees
    servo_min_angle_degrees: 30.0
    servo_max_angle_degrees: 150.0
    servo_move_duration_ms: 500
    buzzer_frequency_topic: /buzzer/frequency
    linear_slew_rate: 3.0
    angular_slew_rate: 6.0
    slew_limit_commands: false
    diagnostics_period: 0.5
    encoder_timeout: 1.0
    encoder_topic: /stm32/encoder_ticks

    camera_ip: 192.168.1.125
    stream_port: 81
    stream_path: /stream
