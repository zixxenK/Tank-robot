/**:
  ros__parameters:
    # Teleop shaping (Left Stick: Throttle, Right Stick: Steer, L2/R2: Left/Right Brakes, L1/R1: Mode Combos)
    max_linear_speed: 0.8
    max_angular_speed: 2.0
    joy_device: /dev/input/js0
    publish_rate_hz: 40.0
    deadzone: 0.08
    expo: 0.25
    trigger_deadzone: 0.05
    profile: auto
    throttle_axis: -1
    steer_axis: -1
    brake_left_axis: -1
    brake_right_axis: -1
    enforce_physical_speed_ceiling: false

    # Tracked chassis geometry
    track_width_m: 0.194
    wheel_separation: 0.194  # Track width in meters (matches track_width_m)
    wheel_radius: 0.065      # TODO: Measure actual wheel/sprocket radius
    encoder_ticks_per_rev: 3960  # From motors_param.h: 11 pulses * 4 edges * 90:1 gearbox
    max_track_speed_mps: 0.8
    input_topic: /cmd_vel
    left_topic: /tracks/left_cmd
    right_topic: /tracks/right_cmd

    # Production link: physical UART1 USB-C -> USART1 PA9/PA10, 1M 8N1.
    serial_port: /dev/rock64_stm32
    baud_rate: 1000000
    max_speed: 255
    command_rate_hz: 50.0
    cmd_timeout: 0.25
    enable_motor_test_services: true
    motor_test_speed: 0.10
    buzzer_frequency_topic: /buzzer/frequency
    linear_slew_rate: 3.0
    angular_slew_rate: 6.0
    diagnostics_period: 0.5
    encoder_timeout: 1.0
    encoder_topic: /stm32/encoder_ticks

    camera_ip: 192.168.1.125
    stream_port: 81
    stream_path: /stream
