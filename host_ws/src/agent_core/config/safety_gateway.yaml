/**:
  ros__parameters:
    # Track geometry and the resulting Twist ceilings are owned by the
    # canonical robot_control/config/control_map.yaml. Bringup passes its
    # installed path explicitly; an empty path is valid for standalone use
    # because the node has the same checked-in fallback.
    control_map_path: ""
    # Compatibility-only overrides. Leave unset/non-positive in production.
    max_linear_speed: -1.0
    max_angular_speed: -1.0
    max_linear_acceleration: 3.0
    # Retained as a configurable safety policy; the active teleop profile
    # disables acceleration shaping so L2 can produce a power pivot.
    max_angular_acceleration: 40.0
    enable_acceleration_limiting: false
    teleop_command_timeout: 0.25
    agent_command_timeout: 0.1
    agent_heartbeat_timeout: 0.1
    output_rate_hz: 50.0
    monitor_battery: false
    battery_startup_grace_period: 5.0
    battery_timeout: 1.0
    minimum_battery_voltage: 10.5
    critical_battery_voltage: 9.5
    battery_recovery_voltage: 10.0
    battery_recovery_time: 2.0
    teleop_command_topic: /cmd_vel
    agent_command_topic: /agent/cmd_vel_proposed
    safe_command_topic: /ranger/cmd_vel_safe
    estop_topic: /safety/e_stop
    agent_heartbeat_topic: /agent/heartbeat
    battery_topic: /stm32/battery
    battery_reset_service: /safety/reset_battery_latch
