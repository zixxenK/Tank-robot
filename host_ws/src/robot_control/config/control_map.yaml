control_map:
  axis_profiles:
    ps5_bluetooth:
      throttle_axis: 1
      steer_axis: 3
      drift_axis: 2
      multiplier_axis: 5
      dpad_x_axis: 6
      dpad_y_axis: 7
    ps5_usb:
      throttle_axis: 1
      steer_axis: 3
      drift_axis: 2
      multiplier_axis: 5
      dpad_x_axis: 6
      dpad_y_axis: 7

  button_indices:
    cross: 0
    circle: 1
    triangle: 2
    square: 3
    l1: 4
    r1: 5
    l2_digital: 6
    r2_digital: 7
    share: 8
    options: 9
    ps: 10
    l3: 11
    r3: 12

  shaping:
    # The live DualSense js0 reports stick center cleanly and trigger release
    # as 0.0 (not -1.0). These values make the neutral state truly neutral.
    deadzone: 0.05
    expo: 0.15
    trigger_deadzone: 0.08
    trigger_neutral: 0.0
    steering_gain: 0.7

  throttle:
    # R2 released = controllable cruise speed; fully pressed = 100% speed.
    cruise_gain: 0.8

  smoothing:
    # Maximum normalized track change per second.
    track_slew_per_s: 10.0

  drift:
    alpha: 0.9
    beta: 2.75

  geometry:
    # Differential-drive B: center-to-center distance between the two drive
    # tracks. The checked-in 0.194 m value is the available outer-bracket
    # dimension and remains provisional until the drive-center spacing is
    # measured on the assembled chassis.
    track_width_m: 0.194
    max_track_speed_mps: 0.8
